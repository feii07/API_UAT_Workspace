[package]
name = "api-uat-workspace"
version = "0.1.0"
description = "Production-like local API UAT workspace"
authors = ["API UAT Workspace"]
edition = "2021"

[lib]
name = "api_uat_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.11.1" }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
calamine = "0.31"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"
base64 = "0.22"
thiserror = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
