name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri
        run: npm run tauri build

      - name: Prepare Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable

          Copy-Item `
            ".\src-tauri\target\release\api_uat_workspace.exe" `
            ".\portable\API-UAT-Workspace.exe"

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\portable\*" `
            -DestinationPath ".\API-UAT-Workspace-Portable.zip" `
            -Force

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: API-UAT-Workspace-Portable
          path: API-UAT-Workspace-Portable.zip
          if-no-files-found: error
