name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri
        run: npm run tauri build

      - name: Debug build output
        shell: pwsh
        run: |
          Write-Host "=== CURRENT DIRECTORY ==="
          Get-Location
      
          Write-Host "=== ALL EXE FILES ==="
          Get-ChildItem -Path . -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
      
          Write-Host "=== ALL MSI FILES ==="
          Get-ChildItem -Path . -Recurse -File -Filter "*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }
      
          Write-Host "=== SRC-TAURI TARGET ==="
          if (Test-Path ".\src-tauri\target") {
            Get-ChildItem ".\src-tauri\target" -Recurse -File |
              ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "src-tauri\target NOT FOUND"
          }
      
