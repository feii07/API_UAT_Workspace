name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri
        run: npm run tauri build

      - name: Debug build output
        shell: pwsh
        run: |
          Write-Host "=== TARGET DIRECTORY ==="
          if (Test-Path "src-tauri/target") {
            Get-ChildItem "src-tauri/target" -Recurse -File |
              Select-Object FullName
          } else {
            Write-Host "src-tauri/target DOES NOT EXIST"
          }
      
          Write-Host "=== ALL EXE ==="
          Get-ChildItem . -Recurse -File -Filter "*.exe" |
            Select-Object FullName
      
          Write-Host "=== ALL MSI ==="
          Get-ChildItem . -Recurse -File -Filter "*.msi" |
            Select-Object FullName
      
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: API-UAT-Workspace-Windows
          path: |
            */.exe
            */.msi
          if-no-files-found: error
